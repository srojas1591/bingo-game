<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <title>Bingo en Español — Multiplayer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: #fff;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
    }

    /* Matrix animated background */
    @keyframes move {
      100% {
        transform: translate3d(0, 0, 1px) rotate(360deg);
      }
    }

    .background {
      position: fixed;
      width: 100vw;
      height: 100vh;
      top: 0;
      left: 0;
      background: #000000;
      overflow: hidden;
      z-index: 0;
    }

    .background span {
      width: 12vmin;
      height: 12vmin;
      border-radius: 12vmin;
      backface-visibility: hidden;
      position: absolute;
      animation: move;
      animation-duration: 45;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    .background span:nth-child(1) {
      color: #00ff2a;
      top: 96%;
      left: 47%;
      animation-duration: 31s;
      animation-delay: -32s;
      transform-origin: 17vw 19vh;
      box-shadow: -24vmin 0 3.473705274696987vmin currentColor;
    }
    .background span:nth-child(2) {
      color: #00ff2a;
      top: 81%;
      left: 15%;
      animation-duration: 54s;
      animation-delay: -43s;
      transform-origin: 16vw 10vh;
      box-shadow: -24vmin 0 3.5425068900912073vmin currentColor;
    }
    .background span:nth-child(3) {
      color: #00ff2a;
      top: 37%;
      left: 30%;
      animation-duration: 23s;
      animation-delay: -23s;
      transform-origin: 6vw 9vh;
      box-shadow: -24vmin 0 3.086992214581085vmin currentColor;
    }
    .background span:nth-child(4) {
      color: #00ff2a;
      top: 34%;
      left: 7%;
      animation-duration: 17s;
      animation-delay: -11s;
      transform-origin: 1vw 9vh;
      box-shadow: -24vmin 0 3.69606446829724vmin currentColor;
    }
    .background span:nth-child(5) {
      color: #00ff2a;
      top: 77%;
      left: 28%;
      animation-duration: 41s;
      animation-delay: -46s;
      transform-origin: 22vw -9vh;
      box-shadow: -24vmin 0 3.474667232341837vmin currentColor;
    }
    .background span:nth-child(6) {
      color: #00ff2a;
      top: 26%;
      left: 24%;
      animation-duration: 36s;
      animation-delay: -9s;
      transform-origin: 10vw 24vh;
      box-shadow: 24vmin 0 3.9945882704913336vmin currentColor;
    }
    .background span:nth-child(7) {
      color: #00ff2a;
      top: 92%;
      left: 31%;
      animation-duration: 13s;
      animation-delay: -49s;
      transform-origin: 6vw 9vh;
      box-shadow: 24vmin 0 3.341730281272292vmin currentColor;
    }
    .background span:nth-child(8) {
      color: #00ff2a;
      top: 97%;
      left: 68%;
      animation-duration: 28s;
      animation-delay: -17s;
      transform-origin: -2vw 18vh;
      box-shadow: -24vmin 0 3.4596339280746906vmin currentColor;
    }
    .background span:nth-child(9) {
      color: #00ff2a;
      top: 98%;
      left: 59%;
      animation-duration: 54s;
      animation-delay: -23s;
      transform-origin: 24vw 12vh;
      box-shadow: 24vmin 0 3.256313391895843vmin currentColor;
    }
    .background span:nth-child(10) {
      color: #00ff2a;
      top: 67%;
      left: 49%;
      animation-duration: 44s;
      animation-delay: -32s;
      transform-origin: -16vw -2vh;
      box-shadow: -24vmin 0 3.4474056770981063vmin currentColor;
    }
    .background span:nth-child(11) {
      color: #00ff2a;
      top: 49%;
      left: 29%;
      animation-duration: 45s;
      animation-delay: -1s;
      transform-origin: 12vw -11vh;
      box-shadow: -24vmin 0 3.396148289997006vmin currentColor;
    }
    .background span:nth-child(12) {
      color: #00ff2a;
      top: 43%;
      left: 100%;
      animation-duration: 22s;
      animation-delay: -18s;
      transform-origin: -8vw 5vh;
      box-shadow: -24vmin 0 3.2136238484644157vmin currentColor;
    }
    .background span:nth-child(13) {
      color: #00ff2a;
      top: 31%;
      left: 46%;
      animation-duration: 44s;
      animation-delay: -38s;
      transform-origin: -6vw -24vh;
      box-shadow: -24vmin 0 3.875469053589724vmin currentColor;
    }

    /* Router content */
    .router-box {
      text-align: center;
      max-width: 800px;
      width: 100%;
      position: relative;
      z-index: 1;
    }
    .router-box h1 {
      font-size: 5rem;
      margin-bottom: 12px;
      text-shadow: 0 0 20px rgba(0, 255, 42, 0.6);
    }
    .router-box p {
      font-size: 1.6rem;
      margin-bottom: 48px;
      opacity: 0.9;
      color: #00ff2a;
    }
    .router-buttons {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }
    .router-btn {
      display: block;
      padding: 48px 48px;
      border: 2px solid #00ff2a;
      border-radius: 24px;
      font-size: 2rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      cursor: pointer;
      background: rgba(0, 0, 0, 0.6);
      color: #00ff2a;
      box-shadow: 0 0 20px rgba(0, 255, 42, 0.2), inset 0 0 20px rgba(0, 255, 42, 0.05);
    }
    .router-btn:active { transform: scale(0.97); }
    .router-btn:hover {
      background: rgba(0, 255, 42, 0.1);
      box-shadow: 0 0 40px rgba(0, 255, 42, 0.4), inset 0 0 30px rgba(0, 255, 42, 0.1);
    }
    .router-btn.host {
      border-color: #00ff2a;
    }
    .router-btn.player {
      border-color: #00ff2a;
    }
    .router-btn span {
      display: block;
      font-size: 1.2rem;
      font-weight: 400;
      margin-top: 8px;
      opacity: 0.8;
    }

    @media (max-width: 600px) {
      .router-box h1 { font-size: 3.5rem; }
      .router-box p { font-size: 1.2rem; margin-bottom: 32px; }
      .router-btn { padding: 36px 32px; font-size: 1.6rem; }
      .router-btn span { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <div class="background">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>

  <div class="router-box">
    <h1>🎱 Bingo</h1>
    <p>Elige cómo quieres jugar</p>
    <div class="router-buttons">
      <a href="views/host.html" class="router-btn host">
        🎤 Soy el Anfitrión
        <span>Controla el juego y saca los números</span>
      </a>
      <a href="views/player.html" class="router-btn player">
        🎮 Soy Jugador
        <span>Únete al juego con tu cartón</span>
      </a>
    </div>
  </div>
</body>
</html>
